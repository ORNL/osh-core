HttpServerConfig.module.name=HTTP Server
HttpServerConfig.module.description=Embedded Jetty HTTP/HTTPS server for SensorHub services and web UI
HttpServerConfig.httpPort.label=HTTP Port
HttpServerConfig.httpPort.description=TCP port for unencrypted HTTP connections (0 disables HTTP)
HttpServerConfig.httpsPort.label=HTTPS Port
HttpServerConfig.httpsPort.description=TCP port for TLS-encrypted HTTPS connections (0 disables HTTPS)
HttpServerConfig.staticDocsRootUrl.label=Static Content URL
HttpServerConfig.staticDocsRootUrl.description=Root URL path where static web content is served
HttpServerConfig.staticDocsRootDir.label=Static Content Directory
HttpServerConfig.staticDocsRootDir.description=Filesystem directory containing static web assets
HttpServerConfig.servletsRootUrl.label=Servlets Root URL
HttpServerConfig.servletsRootUrl.description=URL prefix applied to all SensorHub servlet endpoints
HttpServerConfig.proxyBaseUrl.label=Proxy Base URL
HttpServerConfig.proxyBaseUrl.description=External base URL when requests pass through a reverse proxy
HttpServerConfig.authMethod.label=Authentication Method
HttpServerConfig.authMethod.description=Method used to authenticate users on this HTTP server
HttpServerConfig.keyStorePath.label=Keystore Path
HttpServerConfig.keyStorePath.description=Path to the TLS keystore file containing the server certificate and private key
HttpServerConfig.keyStorePassword.label=Keystore Password
HttpServerConfig.keyStorePassword.description=Password unlocking the TLS keystore and server keypair
HttpServerConfig.keyAlias.label=Key Alias
HttpServerConfig.keyAlias.description=Alias of the server keypair entry inside the keystore
HttpServerConfig.trustStorePath.label=Truststore Path
HttpServerConfig.trustStorePath.description=Path to the TLS truststore used for client certificate verification
HttpServerConfig.trustStorePassword.label=Truststore Password
HttpServerConfig.trustStorePassword.description=Password for the TLS truststore
HttpServerConfig.xmlConfigFile.label=Jetty XML Config
HttpServerConfig.xmlConfigFile.description=Optional external Jetty IoC XML configuration file path
HttpServerConfig.enableCORS.label=Enable CORS
HttpServerConfig.enableCORS.description=Generate Cross-Origin Resource Sharing headers for browser clients
HttpServerConfig.corsAllowedOrigins.label=CORS Allowed Origins
HttpServerConfig.corsAllowedOrigins.description=Origins permitted to make cross-origin requests (* allows all)
HttpServerConfig.AuthMethod.value.NONE=None
HttpServerConfig.AuthMethod.value.BASIC=HTTP Basic
HttpServerConfig.AuthMethod.value.DIGEST=HTTP Digest
HttpServerConfig.AuthMethod.value.CERT=Client Certificate
HttpServerConfig.AuthMethod.value.EXTERNAL=External Module
