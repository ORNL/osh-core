// Legacy Bintray/GrGit release automation was replaced by GitHub Actions
// (.github/workflows/release.yml). Keep a lightweight Gradle 9+ compatible
// placeholder task so downstream build scripts that depend on 'release' keep resolving.
tasks.register('release') {
  group = 'release'
  description = 'Builds release distributions (GitHub Releases are published via CI workflows).'
  dependsOn tasks.matching { it.name == 'build' }
}
